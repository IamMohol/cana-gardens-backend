name: Test and Deploy Laravel API to Hostinger

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Automated Tests & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check Code Style (Pint)
        run: ./vendor/bin/pint --test

      - name: Run Automated Tests
        run: php artisan test
        env:
          APP_KEY: base64:sO8s8V3QW3QW3QW3QW3QW3QW3QW3QW3QW3QW3QW3QW0=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  deploy:
    name: Deploy to Hostinger
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Hostinger
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            cd /home/u585677773/domains/canagardens.co.ke/public_html/api-backend

            PHP_BIN="/opt/alt/php83/usr/bin/php"
            COMPOSER_BIN=$(which composer 2>/dev/null || echo "/usr/local/bin/composer")

            $PHP_BIN artisan down --retry=60 || true

            git pull origin main

            $PHP_BIN "$COMPOSER_BIN" install --no-dev --optimize-autoloader --no-interaction

            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan optimize

            $PHP_BIN artisan up
          EOF
